[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alfred-agent"
version = "0.1.0"
description = "Personalizable self-hosted AI agent — Markdown skills and local playbooks adapt Alfred to engineering, project management, or any team workflow. Slack @alfred, git/JIRA integrations, thread memory, and pluggable LLMs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Alfred Contributors" }]
keywords = ["agent", "slack", "ai", "self-hosted", "playbooks", "jira", "github", "project-management", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    "sqlalchemy>=2.0.0",
    "requests>=2.31.0",
    "cryptography>=41.0.0",
    "click>=8.1.0",
    "slack-bolt>=1.21.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ai-openai = ["openai>=1.0.0"]
ai-anthropic = ["anthropic>=0.15.0"]
ai-gemini = ["google-genai>=0.1.0"]
ai = ["openai>=1.0.0", "anthropic>=0.15.0", "google-genai>=0.1.0"]
aws = ["boto3>=1.28.0"]
google = [
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth-httplib2>=0.1.0",
]
graphify = ["graphifyy>=0.5.0", "openai>=1.0.0"]
dev = ["pytest>=7.0.0", "httpx>=0.24.0", "ruff>=0.1.0"]

[project.scripts]
alfred = "backend.cli:main"

[project.urls]
Homepage = "https://github.com/alfred-agent/alfred"
Documentation = "https://github.com/alfred-agent/alfred#readme"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.hatch.build.targets.sdist]
include = [
    "/backend",
    "/skills",
    "/frontend/dist",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
