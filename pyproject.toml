[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alfred-agent"
version = "0.1.0"
description = "Distributable DevOps agent for small companies — Slack, Git, AWS with skill-based governance"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Alfred Contributors" }]
keywords = ["agent", "devops", "slack", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    "sqlalchemy>=2.0.0",
    "requests>=2.31.0",
    "cryptography>=41.0.0",
    "click>=8.1.0",
    "slack-bolt>=1.21.0",
]

[project.optional-dependencies]
ai-openai = ["openai>=1.0.0"]
ai-anthropic = ["anthropic>=0.15.0"]
ai-gemini = ["google-genai>=0.1.0"]
ai = ["openai>=1.0.0", "anthropic>=0.15.0", "google-genai>=0.1.0"]
dev = ["pytest>=7.0.0", "httpx>=0.24.0", "ruff>=0.1.0"]

[project.scripts]
alfred = "backend.cli:main"

[project.urls]
Homepage = "https://github.com/alfred-agent/alfred"
Documentation = "https://github.com/alfred-agent/alfred#readme"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.hatch.build.targets.sdist]
include = [
    "/backend",
    "/skills",
    "/frontend/dist",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
